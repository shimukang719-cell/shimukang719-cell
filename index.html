<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Digital Space</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(
        -45deg, #10152a, #263c72, #49316c, #122d49
      );
      background-size: 400% 400%;
      animation: gradient 12s ease infinite;
      overflow-x: hidden;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .orb {
      position: fixed;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: #8797ff;
      filter: blur(65px);
      opacity: 0.45;
      pointer-events: none;
      animation: float 8s ease-in-out infinite alternate;
    }

    .orb.one {
      top: 10%;
      left: -50px;
    }

    .orb.two {
      right: -60px;
      bottom: 10%;
      background: #d879ff;
      animation-delay: -4s;
    }

    @keyframes float {
      from { transform: translateY(-20px); }
      to { transform: translateY(50px); }
    }

    header {
      max-width: 1000px;
      margin: auto;
      padding: 25px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .logo {
      font-size: 19px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .status {
      color: #a9ffc7;
      font-size: 13px;
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 850px;
      margin: 70px auto;
      padding: 25px;
      text-align: center;
      animation: appear 1.2s ease both;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tag {
      color: #c1caff;
      letter-spacing: 4px;
      font-size: 13px;
    }

    h1 {
      font-size: clamp(42px, 9vw, 76px);
      margin: 25px 0 15px;
      background: linear-gradient(90deg, #fff, #b5c4ff, #f2c3ff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: #d7def5;
      font-size: 19px;
      line-height: 1.8;
    }

    .card {
      max-width: 520px;
      margin: 35px auto;
      padding: 28px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 22px;
      background: rgba(255,255,255,0.09);
      backdrop-filter: blur(12px);
      box-shadow: 0 15px 50px rgba(0,0,0,0.18);
      transition: transform 0.3s, background 0.3s;
    }

    .card:hover {
      transform: translateY(-6px);
      background: rgba(255,255,255,0.14);
    }

    .school-link {
      display: inline-block;
      margin-top: 16px;
      padding: 15px 24px;
      border-radius: 50px;
      background: linear-gradient(90deg, #7187ff, #a17aff);
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: transform 0.25s, box-shadow 0.25s;
    }

    .school-link:hover {
      transform: scale(1.06);
      box-shadow: 0 0 25px rgba(137,145,255,0.65);
    }

    .clock {
      margin-top: 25px;
      color: #cbd4f3;
      font-size: 14px;
    }

    footer {
      position: relative;
      z-index: 1;
      padding: 25px;
      text-align: center;
      color: #c0c8e5;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      main {
        margin: 35px auto;
        padding: 20px;
      }

      .card {
        padding: 22px 15px;
      }

      .subtitle {
        font-size: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="orb one"></div>
  <div class="orb two"></div>

  <header>
    <div class="logo">MY SPACE.</div>
    <div class="status">● WEBSITE ONLINE</div>
  </header>

  <main>
    <div class="tag">WELCOME TO MY WEBSITE</div>

    <h1>Hello, World!</h1>

    <p class="subtitle">
      探索新知识，学习新技能，创造属于自己的未来。
      <br>
      欢迎来到我的个人数字空间。
    </p>

    <section class="card">
      <h2>🎓 My School</h2>
      <p>O’Connell Secondary School</p>
      <p>欢迎访问我在都柏林的学校官方网站。</p>

      <a
        class="school-link"
        href="https://www.oconnellschool.ie/"
        target="_blank"
        rel="noopener noreferrer"
      >
        访问我的学校 ↗
      </a>
    </section>

    <div class="clock" id="clock">正在加载时间……</div>
  </main>

  <footer>
    © 2026 My Digital Space · Made with HTML, CSS & JavaScript
  </footer>

  <script>
    function updateClock() {
      const now = new Date();

      document.getElementById("clock").textContent =
        "当前时间：" + now.toLocaleTimeString("en-IE");
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
